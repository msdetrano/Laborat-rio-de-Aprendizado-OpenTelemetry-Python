receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Exporta Traces para o Jaeger usando protocolo OTLP/gRPC
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Exporta Métricas abrindo um endpoint HTTP para o Prometheus raspar (scrape)
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otel

  # Exporta Logs e Traces para o stdout do contêiner (útil para debug)
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

  telemetry:
    logs:
      level: "info"
